<!doctype html><meta charset="utf-8"><div id="app"></div><pre id="out"></pre>
<script>
// Attrappen: Mikrofon, Recorder, Sprachausgabe, Server. Kein echtes Token, kein echter Server.
localStorage.setItem('bt', JSON.stringify({ bridge: 'http://stub', token: 'dummy-not-a-secret', deck: [{de:'Um Rabatt bitten', en:'Could we agree on ... ?', box:0, due:'2000-01-01'}] }));
const calls = [];
window.fetch = async (url, o) => {
  const path = url.replace('http://stub', ''); calls.push(path);
  const j = { '/reply': { reply: 'Hello, shall we start?' }, '/stt': { text: 'we need other conditions' },
    '/auth': { ok: true },
    '/feedback': { better: 'We need different terms.', c1: 'Could we revisit the terms?', note: 'Satzbau ok', gaps: [{de:'Bedingungen',en:'terms'}],
      chunks: [{de:'Bitten',en:'Could we discuss ... ?'}], focus: { de: 'Subjekt nutzen', starter: 'We need', model: 'We need different terms.', type: 'x' } },
    '/check': { fixed: true, comment: 'Gut gemacht!' } }[path];
  await new Promise(r => setTimeout(r, 20));
  return { ok: !!j, status: j ? 200 : 404, json: async () => j || { error: 'x' } };
};
let tracksStopped = 0;
navigator.mediaDevices.getUserMedia = async () => ({ getTracks: () => [{ stop: () => tracksStopped++ }] });
window.MediaRecorder = class { constructor() { this.mimeType = 'audio/webm'; } start() {} stop() { this.ondataavailable && this.ondataavailable({ data: new Blob(['x']) }); setTimeout(() => this.onstop && this.onstop(), 5); } };
Object.defineProperty(window, 'speechSynthesis', { value: { cancel() {}, speak() {} }, configurable: true }); window.SpeechSynthesisUtterance = class {};
Object.defineProperty(navigator, 'wakeLock', { value: { request: async () => ({ release() {} }) }, configurable: true });
</script>
<script src="../app.js"></script>
<script>
const R = {}, sleep = ms => new Promise(r => setTimeout(r, ms)), $$ = s => [...document.querySelectorAll(s)];
const btn = t => $$('button').find(b => b.textContent.includes(t));
(async () => {
  try {
    R.homeRendered = !!btn('Wiederholen') && $$('button').length > 8;
    btn('Angebot').click(); await sleep(150);
    R.openingShown = $$('.bub.ai').some(d => d.textContent.includes('Hello'));
    const big = $$('button.big')[0];
    R.bigEnabledAfterOpening = !big.disabled;
    big.click(); await sleep(100);
    R.bigLabelWhileRecording = big.textContent;               // erwartet: ■ Fertig
    big.click(); await sleep(400);
    R.userBubble = $$('.bub.me').some(d => d.textContent.includes('other conditions'));
    R.aiReply = $$('.bub.ai').length;                          // Eröffnung + Antwort = 2
    R.feedbackCard = $$('.fb').length === 1 && $$('.fb')[0].textContent.includes('Dein Fokus');
    R.betterHiddenBehindDetails = !!$$('.fb details summary').find(s => s.textContent.includes('Korrigierte Version'));
    const retry = btn('Nochmal sagen'); retry.click(); await sleep(100); retry.click(); await sleep(400);
    R.retryResult = $$('.fb .mut').map(d => d.textContent).join('|').includes('Gut gemacht');
    R.deckAfterFeedback = JSON.parse(localStorage.getItem('bt')).deck.length;   // 1 + 1 neuer Baustein = 2
    R.runsCounted = JSON.parse(localStorage.getItem('bt')).runs.preis;
    btn('Zurück').click(); await sleep(50);
    R.backHome = !!btn('Wiederholen');
    R.micFreedAfterLeave = tracksStopped >= 2;
    // Wiederholen
    btn('Wiederholen').click(); await sleep(50);
    R.reviewShown = $$('.en')[0] && $$('.en')[0].textContent.includes('Rabatt');
    R.reviewHasStart = document.body.textContent.includes('Anfang:');
    const sp = btn('Sagen'); sp.click(); await sleep(100); sp.click(); await sleep(400);
    R.reviewRevealed = !!btn('Gewusst'); R.reviewText = document.getElementById('app').textContent.slice(0, 300); R.buttons = $$('button').map(b => b.textContent).join(' | ');
    btn('Gewusst').click(); await sleep(50);
    R.reviewBoxAfter = JSON.parse(localStorage.getItem('bt')).deck.find(c => c.en.startsWith('Could we agree')).box;
    // Einstellungen testen
    btn('Zurück') && btn('Zurück').click(); await sleep(30);
    btn('Einstellungen').click(); await sleep(30);
    btn('Speichern und testen').click(); await sleep(150);
    R.settingsMsg = document.body.textContent.includes('Token stimmt');
    R.calls = calls.join(',');
  } catch (e) { R.error = String(e && e.stack || e); }
  document.getElementById('out').textContent = 'RESULT ' + JSON.stringify(R);
})();
</script>
